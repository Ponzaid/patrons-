# Va en tu repo en: .github/workflows/update-patrons.yml
# Regenera public/patrons.json desde Patreon y lo publica en GitHub Pages.

name: Update patrons

on:
  schedule:
    # Cada 6 h (UTC). Cada ejecución rota el refresh token, así que menos
    # ejecuciones = menos oportunidades de romper la cadena de tokens.
    - cron: "0 */6 * * *"
  workflow_dispatch:          # botón para correrlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos ejecuciones se pisen
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch patrons
        env:
          PATREON_CLIENT_ID: ${{ secrets.PATREON_CLIENT_ID }}
          PATREON_CLIENT_SECRET: ${{ secrets.PATREON_CLIENT_SECRET }}
          PATREON_REFRESH_TOKEN: ${{ secrets.PATREON_REFRESH_TOKEN }}
          ROTATED_TOKEN_FILE: ${{ runner.temp }}/patreon_refresh_token
        run: python fetch_patrons.py

      # Patreon rota el refresh token en cada uso. Sin este paso, la ejecución
      # siguiente usaría el token ya gastado y daría 401.
      # `always()`: aunque la descarga falle después, el token nuevo debe guardarse.
      - name: Guardar el refresh token rotado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PATRONS_SECRET_WRITER }}
        run: |
          f="${{ runner.temp }}/patreon_refresh_token"
          [ -s "$f" ] || exit 0
          gh secret set PATREON_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
